<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị viên</title>
    <link rel="stylesheet" href="css/caidat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="admin-layout">
    <aside class="sidebar">
        <div class="menu-item" data-page="Dashboard.html">Dashboard</div>
        <div class="menu-item" data-page="DonHang.html">Đơn hàng</div>
        <div class="menu-item" data-page="SanPham.html">Sản phẩm</div>
        <div class="menu-item" data-page="KhachHang.html">Khách hàng</div>
        <div class="menu-item" data-page="ThongKe.html">Thống kê</div>
        <div class="menu-item active" data-page="CaiDat.html">Cài đặt</div>
        <div class="logout" id="logout">Đăng xuất</div>
    </aside>
    <main class="main-content">
        <header class="admin-header">
            <h1>Food<span>Shop</span></h1>

            <div class="admin-info">
                <i class="fa-regular fa-bell"></i>
                <img src="images/avatar.jpg" alt="Admin">
                <div>
                    <h4>Admin</h4>
                    <p>Quản trị viên</p>
                </div>
            </div>
        </header>
        <section class="setting-page">
            <h1 class="setting-title">
                Cài đặt hệ thống
            </h1>
            <div class="setting-container">

                <div class="setting-card">

                    <h3>Thông tin cửa hàng</h3>

                    <div class="form-group">
                        <label>Tên cửa hàng</label>
                        <input type="text" value="FoodShop">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="support@foodshop.vn">
                    </div>

                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" value="0987654321">
                    </div>

                    <div class="form-group">
                        <label>Địa chỉ</label>
                        <input type="text" value="02 Nguyễn Đình Chiểu, Nha Trang">
                    </div>

                </div>

                <div class="setting-card">
                    <h3>Đổi mật khẩu</h3>
                    <div class="form-group">
                        <label>Mật khẩu hiện tại</label>
                        <input type="password">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu mới</label>
                        <input type="password">
                    </div>
                    <div class="form-group">
                        <label>Nhập lại mật khẩu mới</label>
                        <input type="password">
                    </div>
                </div>
            </div>
            <button class="save-setting-btn">
                Lưu thay đổi
            </button>
        </section>       
    </main>
    
    </div>
<script src="JS/sidebar.js"></script>
<script src="JS/khachhang.js"></script>
</body>
</html>
