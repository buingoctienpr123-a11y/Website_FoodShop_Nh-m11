<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết đơn hàng của khách</title>
    <link rel="stylesheet" href="css/chitietdonhang.css">
</head>
<body>
     <header>
        <h1>Food<span>Shop</span></h1>
    </header>
    <main>
        <section class="order-detail-page">
            <button class="back-btn" onclick="window.location.href='KhachHang.html'">
                Quay lại
            </button>
            <h1>Chi tiết đơn hàng</h1>
            <div class="detail-top">

                <div class="info-box">
                    <h3>Thông tin khách hàng</h3>

                    <div class="form-row">
                        <label>Họ và tên :</label>
                        <input type="text">
                    </div>

                    <div class="form-row">
                        <label>Số điện thoại :</label>
                        <input type="text">
                    </div>

                    <div class="form-row">
                        <label>Email :</label>
                        <input type="text">
                    </div>

                    <div class="form-row">
                        <label>Địa chỉ giao hàng :</label>
                        <input type="text">
                    </div>
                </div>

                <div class="info-box">
                    <h3>Thông tin đơn hàng</h3>

                    <div class="form-row">
                        <label>Ngày đặt :</label>
                        <input type="text">
                    </div>

                    <div class="form-row">
                        <label>Phương thức thanh toán :</label>
                        <input type="text">
                    </div>

                    <div class="form-row">
                        <label>Trạng thái đơn hàng :</label>
                        <input type="text">
                    </div>

                    <div class="form-row">
                        <label>Ghi chú :</label>
                        <textarea></textarea>
                    </div>
                </div>

            </div>

            <div class="detail-bottom">

                <div class="product-detail-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Đơn giá</th>
                                <th>Số lượng</th>
                                <th>Thành tiền</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td class="product-info">
                                    <img src="images/tacos_vỏ_giòn.jpg" alt="">
                                    <span>Tacos vỏ giòn</span>
                                </td>
                                <td>100.000đ</td>
                                <td>2</td>
                                <td>200.000đ</td>
                            </tr>

                            <tr>
                                <td class="product-info">
                                    <img src="images/caca.jpg" alt="">
                                    <span>Coca Cola</span>
                                </td>
                                <td>100.000đ</td>
                                <td>2</td>
                                <td>200.000đ</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="order-summary">
                    <div>
                        <span>Tạm tính :</span>
                        <strong>400.000đ</strong>
                    </div>

                    <div>
                        <span>Phí giao hàng :</span>
                        <strong>15.000đ</strong>
                    </div>

                    <div>
                        <span>Giảm giá :</span>
                        <strong>15.000đ</strong>
                    </div>

                    <div class="final-total">
                        <span>Tổng thành tiền :</span>
                        <strong>400.000đ</strong>
                    </div>
                </div>

            </div>

        </section>
    </main>
</body>
</html>
